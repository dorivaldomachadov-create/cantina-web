<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Funcionários — Cantina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark"><i class="fas fa-utensils"></i></div>
      <span class="logo-text">Cantina</span>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-group-label">Principal</div>
      <a href="/dashboard"    class="nav-link"><i class="fas fa-th-large"></i> Dashboard</a>
      <a href="/vendas/nova"  class="nav-link"><i class="fas fa-cash-register"></i> Nova Venda</a>
      <a href="/estoque"      class="nav-link"><i class="fas fa-boxes-stacked"></i> Estoque</a>
      <div class="nav-group-label" style="margin-top:12px">Gestão</div>
      <a href="/cardapio"     class="nav-link"><i class="fas fa-book-open"></i> Cardápio</a>
      <a href="/vendas/historico" class="nav-link"><i class="fas fa-clock-rotate-left"></i> Histórico</a>
      <a href="/relatorios"   class="nav-link"><i class="fas fa-chart-bar"></i> Relatórios</a>
      <a href="/funcionarios" class="nav-link active"><i class="fas fa-users"></i> Funcionários</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-widget">
        <div class="user-avatar" th:text="${#strings.toUpperCase(#strings.substring(nomeUtilizador,0,1))}">G</div>
        <div>
          <div class="user-name" th:text="${nomeUtilizador}">Gerente</div>
          <div class="user-role">Gerente</div>
        </div>
        <form th:action="@{/logout}" method="post" style="margin:0;margin-left:auto">
          <button type="submit" class="btn-logout"><i class="fas fa-sign-out-alt"></i></button>
        </form>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-title">Funcionários</div>
      <div class="topbar-right">
        <a href="/funcionarios/novo" class="btn btn-primary btn-sm"><i class="fas fa-plus"></i> Novo Funcionário</a>
        <button class="icon-btn" onclick="toggleTheme()"><i class="fas fa-moon" id="theme-icon"></i></button>
      </div>
    </header>

    <div class="content">
      <div th:if="${sucesso}" class="alert alert-success"><i class="fas fa-circle-check"></i><span th:text="${sucesso}"></span></div>
      <div th:if="${erro}"    class="alert alert-danger"><i class="fas fa-circle-xmark"></i><span th:text="${erro}"></span></div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Todos os Utilizadores</span>
          <span class="badge badge-primary" th:text="${#lists.size(funcionarios)} + ' contas'">0</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Nome</th><th>Username</th><th>Email</th><th>Cargo</th><th>Perfil</th><th>Estado</th><th>Criado</th><th>Ações</th></tr>
            </thead>
            <tbody>
              <tr th:each="f : ${funcionarios}">
                <td>
                  <div style="display:flex;align-items:center;gap:10px">
                    <div style="width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0"
                         th:text="${f.avatarInicial}">F</div>
                    <strong th:text="${f.nome}">—</strong>
                  </div>
                </td>
                <td th:text="${f.username}">—</td>
                <td th:text="${f.email}">—</td>
                <td th:text="${f.cargo}">—</td>
                <td>
                  <span class="badge badge-warning" th:if="${f.perfil.name() == 'GERENTE'}"><i class="fas fa-star"></i> Gerente</span>
                  <span class="badge badge-primary"  th:if="${f.perfil.name() == 'FUNCIONARIO'}"><i class="fas fa-user"></i> Funcionário</span>
                </td>
                <td>
                  <span class="badge badge-success" th:if="${f.ativo}">Ativo</span>
                  <span class="badge badge-muted"   th:unless="${f.ativo}">Inativo</span>
                </td>
                <td style="font-size:12px;color:var(--text-muted)" th:text="${f.dataCriacaoFormatada}">—</td>
                <td>
                  <div style="display:flex;gap:5px">
                    <a th:href="@{'/funcionarios/editar/' + ${f.id}}" class="btn btn-outline btn-sm"><i class="fas fa-pen"></i></a>
                    <form th:action="@{'/funcionarios/toggle/' + ${f.id}}" method="post"
                          th:onsubmit="${f.ativo} ? 'return confirm(\'Desativar esta conta?\')' : 'return true'">
                      <button type="submit" class="btn btn-sm"
                              th:classappend="${f.ativo} ? 'btn-danger' : 'btn-success'"
                              th:title="${f.ativo} ? 'Desativar' : 'Ativar'">
                        <i th:classappend="${f.ativo} ? 'fas fa-user-slash' : 'fas fa-user-check'"></i>
                      </button>
                    </form>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<script th:src="@{/js/venda.js}"></script>
</body>
</html>
