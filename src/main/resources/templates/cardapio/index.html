<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6" lang="pt">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cardápio — Cantina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark"><i class="fas fa-utensils"></i></div>
      <span class="logo-text">Cantina</span>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-group-label">Principal</div>
      <a href="/dashboard"    class="nav-link"><i class="fas fa-th-large"></i> Dashboard</a>
      <a href="/vendas/nova"  class="nav-link"><i class="fas fa-cash-register"></i> Nova Venda</a>
      <a href="/estoque"      class="nav-link"><i class="fas fa-boxes-stacked"></i> Estoque</a>
      <div class="nav-group-label" style="margin-top:12px">Gestão</div>
      <a href="/cardapio"     class="nav-link active"><i class="fas fa-book-open"></i> Cardápio</a>
      <a href="/vendas/historico" class="nav-link"><i class="fas fa-clock-rotate-left"></i> Histórico</a>
      <a href="/relatorios"   class="nav-link"><i class="fas fa-chart-bar"></i> Relatórios</a>
      <a href="/funcionarios" class="nav-link"><i class="fas fa-users"></i> Funcionários</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-widget">
        <div class="user-avatar" th:text="${#strings.toUpperCase(#strings.substring(nomeUtilizador,0,1))}">G</div>
        <div>
          <div class="user-name" th:text="${nomeUtilizador}">Gerente</div>
          <div class="user-role">Gerente</div>
        </div>
        <form th:action="@{/logout}" method="post" style="margin:0;margin-left:auto">
          <button type="submit" class="btn-logout" title="Sair"><i class="fas fa-sign-out-alt"></i></button>
        </form>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-title">Cardápio</div>
      <div class="topbar-right">
        <a href="/cardapio/novo" class="btn btn-primary btn-sm"><i class="fas fa-plus"></i> Novo Produto</a>
        <button class="icon-btn" onclick="toggleTheme()" title="Tema"><i class="fas fa-moon" id="theme-icon"></i></button>
      </div>
    </header>

    <div class="content">
      <div th:if="${sucesso}" class="alert alert-success"><i class="fas fa-circle-check"></i><span th:text="${sucesso}"></span></div>
      <div th:if="${erro}"    class="alert alert-danger"><i class="fas fa-circle-xmark"></i><span th:text="${erro}"></span></div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Todos os Produtos</span>
          <div class="input-group" style="width:210px">
            <i class="input-icon fas fa-search"></i>
            <input class="form-control" type="text" placeholder="Filtrar..." id="f-card"
                   oninput="filtrarTabela('f-card','t-card',1)"/>
          </div>
        </div>
        <div class="table-wrap">
          <table id="t-card">
            <thead>
              <tr><th>Produto</th><th>Categoria</th><th>Preço</th><th>Stock</th><th>Estado</th><th>Ações</th></tr>
            </thead>
            <tbody>
              <tr th:each="p : ${produtos}">
                <td><strong th:text="${p.nome}">—</strong></td>
                <td><span class="badge badge-primary" th:text="${p.categoria}">—</span></td>
                <td class="fw-700 text-brand" th:text="'Kz ' + ${#numbers.formatDecimal(p.preco,0,'POINT',0,'COMMA')}">0</td>
                <td>
                  <div class="stock-bar">
                    <div class="stock-dot"
                         th:classappend="${p.quantidadeEstoque == 0 ? 'empty' : (p.quantidadeEstoque <= 5 ? 'low' : 'ok')}">
                    </div>
                    <span th:text="${p.quantidadeEstoque} + ' un'">0</span>
                  </div>
                </td>
                <td>
                  <span class="badge badge-success" th:if="${p.ativo}">Ativo</span>
                  <span class="badge badge-muted"   th:unless="${p.ativo}">Inativo</span>
                </td>
                <td>
                  <div style="display:flex;gap:5px">
                    <a th:href="@{'/cardapio/editar/' + ${p.id}}" class="btn btn-outline btn-sm"><i class="fas fa-pen"></i></a>
                    <form th:action="@{'/cardapio/toggle/' + ${p.id}}" method="post"
                          th:onsubmit="${p.ativo} ? 'return confirm(\'Desativar?\')' : 'return true'">
                      <button type="submit" class="btn btn-sm"
                              th:classappend="${p.ativo} ? 'btn-danger' : 'btn-success'">
                        <i th:classappend="${p.ativo} ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                      </button>
                    </form>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<script th:src="@{/js/venda.js}"></script>
<script>
function filtrarTabela(inputId, tabelaId, col) {
  const v = document.getElementById(inputId).value.toLowerCase();
  document.querySelectorAll('#' + tabelaId + ' tbody tr').forEach(r => {
    r.style.display = (r.cells[col]?.textContent.toLowerCase().includes(v)) ? '' : 'none';
  });
}
</script>
</body>
</html>
