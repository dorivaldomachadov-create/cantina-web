<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Cantina Gestão</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div style="height: 100vh; display: flex; align-items: center; justify-content: center;">
        <div class="login-box">
            <h2>Cantina Gestão</h2>
            <h3>Entrar no Sistema</h3>
            
            <div th:if="${param.error}" class="error">Utilizador ou senha incorretos!</div>
            <div th:if="${param.logout}" class="success">Logout realizado com sucesso.</div>

            <form th:action="@{/login}" method="post">
                <input type="text" name="username" placeholder="Utilizador" required/>
                <input type="password" name="password" placeholder="Senha" required/>
                <button type="submit" style="margin-top: 15px;">Entrar</button>
            </form>
        </div>
    </div>
</body>
</html>
